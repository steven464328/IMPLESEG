<script>
        fetch('/api/cartera/init').catch(()=>{}); 
        const isAdmin = document.cookie.includes('rol_erp=administrador');

        if(isAdmin) {
            document.getElementById('panel-admin').style.display = 'block';
            cargarMapeos();
        }
        // Siempre cargamos la cartera, sea admin o vendedor
        cargarMiCartera();

        async function cargarMapeos() {
            try {
                const res = await fetch('/api/cartera/vendedores');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('tabla-correos').innerHTML = `
                        <tr><th>Nombre exacto SIESA</th><th>Correo Configurado</th></tr>
                        ${data.map(v => `<tr><td><b>${v.vendedor}</b></td><td>${v.correo}</td></tr>`).join('')}
                    `;
                }
            } catch (e) { console.error("Error cargando mapeos", e); }
        }

        document.getElementById('form-vendedor').onsubmit = async (e) => {
            e.preventDefault();
            await fetch('/api/cartera/vendedores', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ vendedor: document.getElementById('v-nombre').value, correo: document.getElementById('v-correo').value })
            });
            document.getElementById('form-vendedor').reset();
            cargarMapeos();
        };

        async function subirExcel() {
            const btn = document.getElementById('btn-cargar');
            const fileInput = document.getElementById('file-excel');
            const file = fileInput.files[0];
            
            if(!file) {
                alert("⚠️ Por favor, selecciona primero el archivo Excel de SIESA.");
                return;
            }
            
            const formData = new FormData(); 
            formData.append("file", file);
            
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = "⏳ Leyendo Excel...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/cartera/upload', { method: 'POST', body: formData });
                
                if(res.ok) {
                    const data = await res.json();
                    alert("✅ Archivo procesado por el servidor.");
                    
                    // Si el backend devuelve los registros directamente, los pintamos
                    if (data.registros && Array.isArray(data.registros) && data.registros.length > 0) {
                        renderizarTabla(data.registros);
                    } else {
                        // Si no, forzamos a recargar la tabla consultando la base de datos
                        await cargarMiCartera();
                    }
                } else {
                    const err = await res.text();
                    console.error("Error del backend:", err);
                    alert("❌ El servidor rechazó el archivo. Presiona F12 para ver el error.");
                }
            } catch (error) {
                console.error(error);
                alert("❌ Error de conexión con el servidor.");
            } finally {
                btn.innerHTML = txtOriginal;
                btn.disabled = false;
                fileInput.value = ""; // Limpiar el input
            }
        }

        async function enviarCorreos() {
            if(confirm("¿Proceder con el envío de notificaciones a toda la fuerza de ventas?")) {
                try {
                    const res = await fetch('/api/cartera/notificar', { method: 'POST' });
                    if(res.ok) {
                        const data = await res.json();
                        alert(`✅ Operación exitosa. Correos despachados.`);
                    } else {
                        alert("❌ Error al despachar correos.");
                    }
                } catch(e) { alert("❌ Error conectando con el servidor"); }
            }
        }

        async function cargarMiCartera() {
            try {
                const res = await fetch('/api/cartera/mis-datos');
                if (res.ok) {
                    const data = await res.json();
                    console.log("Datos de cartera recibidos:", data); // ESTO TE AYUDARÁ A VER QUÉ LLEGA (Presiona F12)
                    
                    if (data && data.length > 0) {
                        renderizarTabla(data);
                    } else {
                        document.getElementById('tb-datos-cartera').innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#94a3b8;">No hay registros de cartera para mostrar o no se ha cargado el SIESA.</td></tr>`;
                        document.getElementById('total-saldo').innerText = "$0.00";
                        document.getElementById('total-saldo').style.color = "#10b981";
                    }
                }
            } catch (e) { console.error("Error cargando cartera", e); }
        }

        function renderizarTabla(datos) {
            let total = 0;
            document.getElementById('tb-datos-cartera').innerHTML = datos.map(f => {
                // Buscamos el valor sin importar cómo lo llame el backend (valor, saldo, total, etc)
                const valRaw = f.valor || f.saldo || f.total || f.VALOR || 0;
                // Limpiamos el valor por si viene como texto ("$50.000")
                const val = typeof valRaw === 'string' ? parseFloat(valRaw.replace(/[^0-9.-]+/g,"")) : parseFloat(valRaw);
                
                total += (isNaN(val) ? 0 : val);
                
                // Buscamos los campos comunes ignorando mayúsculas/minúsculas
                const cliente = f.cliente || f.CLIENTE || f.nombre || f.NOMBRE || 'N/A';
                const nit = f.nit || f.NIT || f.documento || '';
                const factura = f.factura || f.FACTURA || f.num_factura || '';
                const vencimiento = f.fecha_vencimiento || f.vencimiento || f.VENCIMIENTO || f.fecha || '';

                return `<tr>
                    <td>${cliente}</td>
                    <td>${nit}</td>
                    <td style="color:#3b82f6;">${factura}</td>
                    <td style="color:#ef4444; font-weight:bold;">${vencimiento}</td>
                    <td style="color:#10b981; font-weight:bold;">$${(isNaN(val) ? 0 : val).toLocaleString('es-CO')}</td>
                </tr>`;
            }).join('');
            
            const lblTotal = document.getElementById('total-saldo');
            lblTotal.innerText = `$${total.toLocaleString('es-CO')}`;
            lblTotal.style.color = total > 0 ? "#ef4444" : "#10b981";
        }
    </script>
