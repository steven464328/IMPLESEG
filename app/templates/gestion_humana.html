  .brand-3d { padding: 8px 4px 24px 4px; display: flex; justify-content: center; align-items: center; }
  .brand-logo-container { width: 100%; perspective: 1000px; }
  .brand-3d-box {
    background: linear-gradient(145deg, #15803d, #052e16); border: 1px solid #22c55e;

  }
  .brand-3d-box:hover { transform: translateY(-4px); box-shadow: 0 8px 0 #022c22, 0 14px 20px rgba(0,0,0,0.7), inset 0 2px 3px rgba(255,255,255,0.45); }
  .brand-title-3d {
    display: block; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; color: #ff6b00;
    text-transform: lowercase; letter-spacing: 1px;
    text-shadow: 0 1px 0 #b33600, 0 2px 0 #802600, 0 3px 0 #4d0f00, 0 4px 6px rgba(0,0,0,0.7);
  }
  .brand-icon-group { margin: 3px 0; font-size: 13px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
  .brand-sub-3d { display: block; font-size: 10px; font-weight: 700; color: #4ade80; text-transform: uppercase; letter-spacing: 1.5px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
